<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Общий список продуктов дома и покупок" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171815" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Запасы" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Домашние запасы</title>
    <script>
      // Тема, акцент и режим «не только цветом» выставляются до первой отрисовки, чтобы
      // экран не мигал чужими цветами, а точки наличия не перерисовывались.
      // Те же ключи и правила — в src/shared/lib/appearance.ts.
      try {
        var theme = localStorage.getItem('home-stock:theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var accent = localStorage.getItem('home-stock:accent')
        if (accent) document.documentElement.dataset.accent = accent
        if (localStorage.getItem('home-stock:color-safe') === 'on') document.documentElement.dataset.colorSafe = ''
      } catch (error) {}
    </script>
    <style>
      /* Пока скачиваются стили и скрипт приложения, экран — цвета темы, а не белый.
         Цвета — те же, что --bg в src/app/styles/tokens.css. Заставку в #root рисуют стили
         приложения (statusNote.css); до них она скрыта, чтобы не мелькнуть чёрным SVG. */
      html {
        background: #f7f6f2;
      }
      html[data-theme='dark'] {
        background: #171815;
      }
      .boot {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="dots" aria-hidden="true"></div>
    <!-- Заставка до запуска React: тот же холодильник, что LoadingPicture (проверяет
         bootSplash.test.ts). React заменит её первым экраном. -->
    <div id="root"><div class="status-note splash boot" data-loading="true"><svg class="loading-picture" data-kind="fridge" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect class="loading-body" x="11" y="3" width="26" height="42" rx="4"></rect><path class="loading-shelf" d="M14 26h20M14 35h20"></path><rect class="loading-food" x="16" y="20" width="5" height="6" rx="1"></rect><circle class="loading-food" cx="28" cy="32" r="3"></circle><rect class="loading-food" x="17" y="38" width="12" height="5" rx="1"></rect><g class="loading-door"><rect x="11" y="17" width="26" height="28" rx="4"></rect><path d="M16 23v6"></path></g><path class="loading-seam" d="M11 16h26"></path></svg></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
