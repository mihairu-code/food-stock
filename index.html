<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Общий список продуктов дома и покупок" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171815" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Запасы" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Домашние запасы</title>
    <script>
      // Тема и акцент выставляются до первой отрисовки, чтобы экран не мигал чужими цветами.
      // Те же ключи и правила — в src/lib/appearance.ts.
      try {
        var theme = localStorage.getItem('home-stock:theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var accent = localStorage.getItem('home-stock:accent')
        if (accent) document.documentElement.dataset.accent = accent
      } catch (error) {}
    </script>
  </head>
  <body>
    <div class="dots" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
