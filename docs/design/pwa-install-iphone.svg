<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc">
<title id="title">Как установить приложение на iPhone</title><desc id="desc">Иллюстрированная инструкция: открыть сайт в Safari, нажать Поделиться, добавить на экран Домой как веб-приложение.</desc>
<defs><pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#f4eedf"/><circle cx="3" cy="4" r=".7" fill="#d8cfbb" opacity=".55"/><path d="M0 17.5H18" stroke="#d8cfbb" stroke-width=".45" opacity=".5"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#c8bda6"/></filter></defs>
<rect width="1080" height="1600" fill="#e9e0ce"/>
<text x="72" y="76" fill="#4f6848" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">ДОМАШНИЕ ЗАПАСЫ · УСТАНОВКА</text>
<text x="72" y="145" fill="#30352e" font-family="Georgia,serif" font-size="54">iPhone</text>
<text x="72" y="192" fill="#66675d" font-family="Arial,sans-serif" font-size="22">Добавьте приложение на экран «Домой» через Safari.</text>
<!-- step 1 -->
<g filter="url(#shadow)"><rect x="72" y="250" width="936" height="340" rx="14" fill="url(#paper)" stroke="#d8cfbb" stroke-width="2"/></g>
<circle cx="126" cy="304" r="26" fill="#4f6848"/><text x="118" y="313" fill="#fffdf5" font-family="Arial" font-weight="700" font-size="24">1</text>
<text x="174" y="300" fill="#30352e" font-family="Georgia,serif" font-size="28">Откройте сайт в Safari</text>
<text x="174" y="338" fill="#66675d" font-family="Arial,sans-serif" font-size="18">Перейдите на адрес приложения.</text>
<rect x="130" y="370" width="400" height="175" rx="22" fill="#fff" stroke="#30352e" stroke-width="3"/>
<text x="153" y="396" fill="#30352e" font-family="Arial" font-size="12">9:41　　　　　　　　 ●●●</text><rect x="153" y="407" width="354" height="106" rx="6" fill="#f4eedf"/><text x="171" y="440" fill="#4f6848" font-family="Arial" font-size="12" font-weight="700">ДОМ · 2 УЧАСТНИКА</text><text x="171" y="471" fill="#30352e" font-family="Georgia" font-size="22">Домашние запасы</text><rect x="153" y="518" width="354" height="18" rx="8" fill="#f1f3f4"/><text x="175" y="531" fill="#666" font-family="Arial" font-size="11">◀　　 ◯　 адрес-приложения.ru　 ↻</text>
<text x="585" y="405" fill="#30352e" font-family="Arial,sans-serif" font-size="20"><tspan x="585" dy="0">Откройте сайт в браузере</tspan><tspan x="585" dy="30" font-weight="700">Safari</tspan><tspan font-weight="400"> (значок компаса).</tspan><tspan x="585" dy="42">Для установки на iPhone</tspan><tspan x="585" dy="30">используйте именно Safari.</tspan></text>
<!-- step 2 -->
<g filter="url(#shadow)"><rect x="72" y="620" width="936" height="390" rx="14" fill="url(#paper)" stroke="#d8cfbb" stroke-width="2"/></g>
<circle cx="126" cy="674" r="26" fill="#4f6848"/><text x="118" y="683" fill="#fffdf5" font-family="Arial" font-weight="700" font-size="24">2</text>
<text x="174" y="670" fill="#30352e" font-family="Georgia,serif" font-size="28">Нажмите «Поделиться»</text>
<text x="174" y="708" fill="#66675d" font-family="Arial,sans-serif" font-size="18">Это кнопка со стрелкой вверх внизу Safari.</text>
<rect x="130" y="740" width="400" height="230" rx="22" fill="#fff" stroke="#30352e" stroke-width="3"/>
<text x="153" y="766" fill="#30352e" font-family="Arial" font-size="12">9:41　　　　　　　　 ●●●</text><rect x="153" y="778" width="354" height="107" rx="6" fill="#f4eedf"/><text x="171" y="812" fill="#4f6848" font-family="Arial" font-size="12" font-weight="700">ДОМ · 2 УЧАСТНИКА</text><text x="171" y="841" fill="#30352e" font-family="Georgia" font-size="22">Домашние запасы</text>
<rect x="153" y="894" width="354" height="55" rx="12" fill="#f3f3f5"/><text x="184" y="929" fill="#3569a8" font-family="Arial" font-size="22">‹　　　 ◇　　 <tspan font-weight="700">↑</tspan>　　　 ▢　　　 ⋯</text><circle cx="342" cy="922" r="23" fill="none" stroke="#3569a8" stroke-width="2"/><path d="M342 932v-19m-7 7 7-7 7 7m-13 6v8h12v-8" fill="none" stroke="#3569a8" stroke-width="2"/>
<path d="M365 920 C440 918 510 851 570 851" fill="none" stroke="#4f6848" stroke-width="3"/><circle cx="365" cy="920" r="6" fill="#4f6848"/>
<text x="585" y="790" fill="#30352e" font-family="Arial,sans-serif" font-size="20"><tspan x="585" dy="0">Нажмите значок</tspan><tspan x="585" dy="31" fill="#4f6848" font-weight="700">«Поделиться»</tspan><tspan fill="#30352e" font-weight="400">.</tspan><tspan x="585" dy="43">Если нижняя панель скрыта,</tspan><tspan x="585" dy="30">слегка прокрутите страницу</tspan><tspan x="585" dy="30">вверх или вниз.</tspan></text>
<!-- step 3 -->
<g filter="url(#shadow)"><rect x="72" y="1040" width="936" height="390" rx="14" fill="url(#paper)" stroke="#d8cfbb" stroke-width="2"/></g>
<circle cx="126" cy="1094" r="26" fill="#4f6848"/><text x="118" y="1103" fill="#fffdf5" font-family="Arial" font-weight="700" font-size="24">3</text>
<text x="174" y="1090" fill="#30352e" font-family="Georgia,serif" font-size="28">Добавьте на экран «Домой»</text>
<text x="174" y="1128" fill="#66675d" font-family="Arial,sans-serif" font-size="18">В меню выберите нужный пункт и подтвердите.</text>
<rect x="130" y="1160" width="400" height="230" rx="22" fill="#fff" stroke="#30352e" stroke-width="3"/>
<rect x="145" y="1173" width="370" height="201" rx="20" fill="#f1f1f4"/><rect x="159" y="1185" width="342" height="178" rx="12" fill="#fff" stroke="#d6d6da"/><text x="176" y="1210" fill="#777" font-family="Arial" font-size="11">Отмена</text><text x="330" y="1210" text-anchor="middle" fill="#30352e" font-family="Arial" font-size="13" font-weight="700">На экран «Домой»</text><text x="480" y="1210" fill="#087cff" font-family="Arial" font-size="12" font-weight="700">Добавить</text><circle cx="190" cy="1250" r="16" fill="#e8eddf"/><text x="181" y="1257" fill="#4f6848" font-family="Arial" font-size="19">⌂</text><rect x="215" y="1236" width="260" height="29" rx="5" fill="#f5f5f7"/><text x="226" y="1255" fill="#30352e" font-family="Arial" font-size="12">Домашние запасы</text><text x="176" y="1300" fill="#30352e" font-family="Arial" font-size="12">Открыть как веб-приложение</text><rect x="440" y="1280" width="44" height="25" rx="13" fill="#34c759"/><circle cx="471" cy="1292" r="10" fill="#fff"/><path d="M176 1320H484" stroke="#e4e4e8"/>
<text x="585" y="1204" fill="#30352e" font-family="Arial,sans-serif" font-size="20"><tspan x="585" dy="0">1. Выберите «На экран</tspan><tspan x="585" dy="30">    Домой».</tspan><tspan x="585" dy="40">2. Включите «Открыть как</tspan><tspan x="585" dy="30">    веб-приложение», если</tspan><tspan x="585" dy="30">    этот пункт доступен.</tspan><tspan x="585" dy="40">3. Нажмите «Добавить».</tspan></text>
<text x="72" y="1490" fill="#30352e" font-family="Georgia,serif" font-size="22">Готово — значок приложения появится на экране «Домой».</text>
<text x="72" y="1530" fill="#66675d" font-family="Arial,sans-serif" font-size="16">Если «На экран Домой» не видно, прокрутите меню вниз. Иконка добавится только на этот iPhone.</text>
<text x="72" y="1570" fill="#4f6848" font-family="Arial,sans-serif" font-size="13" font-weight="700">СХЕМАТИЧНЫЕ ЭКРАНЫ · интерфейс Safari может немного отличаться в зависимости от версии iOS.</text>
</svg>
