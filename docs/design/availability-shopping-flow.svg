<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">Наличие дома и список покупок</title>
  <desc id="desc">Два независимых состояния: наличие продуктов дома и намерение купить продукт.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#f4eedf"/><circle cx="3" cy="4" r=".7" fill="#d8cfbb" opacity=".55"/><path d="M0 17.5H18" stroke="#d8cfbb" stroke-width=".45" opacity=".5"/></pattern>
    <pattern id="sheet" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#fffcf3"/><circle cx="3" cy="4" r=".7" fill="#d8cfbb" opacity=".45"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#c8bda6"/></filter>
  </defs>
  <rect width="1440" height="930" fill="#e9e0ce"/>
  <text x="76" y="78" fill="#4f6848" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">ДОМ · UX-ПРИНЦИП</text>
  <text x="76" y="130" fill="#30352e" font-family="Georgia,serif" font-size="39">Наличие и покупка — разные вещи</text>
  <text x="76" y="166" fill="#66675d" font-family="Arial,sans-serif" font-size="17">Можно докупить продукт, который ещё есть дома. Статус в запасах не блокирует добавление.</text>
  <g filter="url(#shadow)"><rect x="88" y="210" width="492" height="620" rx="22" fill="url(#paper)" stroke="#d8cfbb" stroke-width="2"/></g>
  <text x="122" y="260" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ЭКРАН 01</text>
  <text x="122" y="300" fill="#30352e" font-family="Georgia,serif" font-size="29">Дома</text>
  <rect x="118" y="326" width="432" height="67" rx="7" fill="url(#sheet)" stroke="#d8cfbb"/>
  <text x="139" y="369" font-size="27">🥚</text><text x="183" y="355" fill="#30352e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Яйца</text><text x="183" y="376" fill="#66675d" font-family="Arial,sans-serif" font-size="12">Базовый</text>
  <rect x="263" y="344" width="104" height="29" rx="3" fill="none" stroke="#4f6848"/><text x="276" y="363" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700">✓ Есть</text>
  <rect x="391" y="338" width="137" height="42" rx="5" fill="none" stroke="#4f6848" stroke-width="1.5"/><text x="412" y="364" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700">＋ В покупки</text>
  <path d="M435 385 C438 426 436 431 434 451" fill="none" stroke="#4f6848" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="122" y="456" fill="#66675d" font-family="Arial,sans-serif" font-size="13">Добавление не переключает статус наличия.</text>
  <rect x="118" y="480" width="432" height="67" rx="7" fill="url(#sheet)" stroke="#d8cfbb"/>
  <text x="139" y="523" font-size="27">🥛</text><text x="183" y="509" fill="#30352e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Молоко</text><text x="183" y="530" fill="#66675d" font-family="Arial,sans-serif" font-size="12">Базовый</text>
  <rect x="263" y="498" width="104" height="29" rx="3" fill="none" stroke="#9b3d30"/><text x="271" y="517" fill="#9b3d30" font-family="Arial,sans-serif" font-size="11" font-weight="700">– Закончилось</text>
  <rect x="391" y="492" width="137" height="42" rx="5" fill="#e8eddf" stroke="#4f6848"/><text x="410" y="518" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700">✓ В списке</text>
  <text x="122" y="591" fill="#66675d" font-family="Arial,sans-serif" font-size="13">У базового «Закончилось» создаёт покупку автоматически.</text>
  <g filter="url(#shadow)"><rect x="630" y="210" width="492" height="620" rx="22" fill="url(#paper)" stroke="#d8cfbb" stroke-width="2"/></g>
  <text x="664" y="260" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ЭКРАН 02</text>
  <text x="664" y="300" fill="#30352e" font-family="Georgia,serif" font-size="29">Покупки</text>
  <rect x="660" y="326" width="432" height="73" rx="7" fill="url(#sheet)" stroke="#d8cfbb"/>
  <text x="681" y="371" font-size="27">🥚</text><text x="725" y="354" fill="#30352e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Яйца</text><text x="725" y="378" fill="#66675d" font-family="Arial,sans-serif" font-size="12">Холодильник · базовый · <tspan fill="#4f6848" font-weight="700">✓ Есть дома</tspan></text>
  <rect x="985" y="341" width="91" height="42" rx="5" fill="#4f6848" stroke="#30352e"/><text x="1000" y="367" fill="#fffdf5" font-family="Arial,sans-serif" font-size="12" font-weight="700">Куплено</text>
  <rect x="660" y="410" width="432" height="73" rx="7" fill="url(#sheet)" stroke="#d8cfbb"/>
  <text x="681" y="455" font-size="27">🥛</text><text x="725" y="438" fill="#30352e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Молоко</text><text x="725" y="462" fill="#66675d" font-family="Arial,sans-serif" font-size="12">Холодильник · базовый · <tspan fill="#9b3d30" font-weight="700">– Закончилось</tspan></text>
  <rect x="985" y="425" width="91" height="42" rx="5" fill="#4f6848" stroke="#30352e"/><text x="1000" y="451" fill="#fffdf5" font-family="Arial,sans-serif" font-size="12" font-weight="700">Куплено</text>
  <rect x="660" y="494" width="432" height="73" rx="7" fill="url(#sheet)" stroke="#d8cfbb"/>
  <text x="681" y="539" font-size="27">🍞</text><text x="725" y="522" fill="#30352e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Хлеб</text><text x="725" y="546" fill="#66675d" font-family="Arial,sans-serif" font-size="12">Добавлено вручную · <tspan fill="#66675d" font-weight="700">? Не в запасах</tspan></text>
  <rect x="985" y="509" width="91" height="42" rx="5" fill="#4f6848" stroke="#30352e"/><text x="1000" y="535" fill="#fffdf5" font-family="Arial,sans-serif" font-size="12" font-weight="700">Куплено</text>
  <rect x="1160" y="210" width="220" height="620" rx="8" fill="url(#sheet)" stroke="#d8cfbb" stroke-width="2"/>
  <text x="1186" y="257" fill="#4f6848" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">ПРАВИЛО</text>
  <path d="M1186 278H1350" stroke="#d8cfbb" stroke-dasharray="3 4"/>
  <text x="1186" y="318" fill="#30352e" font-family="Georgia,serif" font-size="20">1. Есть</text><text x="1186" y="347" fill="#66675d" font-family="Arial,sans-serif" font-size="13"><tspan x="1186">Наличие дома</tspan><tspan x="1186" dy="19">— факт о запасах.</tspan></text>
  <text x="1186" y="415" fill="#30352e" font-family="Georgia,serif" font-size="20">2. Купить</text><text x="1186" y="444" fill="#66675d" font-family="Arial,sans-serif" font-size="13"><tspan x="1186">Намерение</tspan><tspan x="1186" dy="19">докупить продукт.</tspan></text>
  <text x="1186" y="514" fill="#30352e" font-family="Georgia,serif" font-size="20">Вместе</text><text x="1186" y="543" fill="#66675d" font-family="Arial,sans-serif" font-size="13"><tspan x="1186">Оба состояния</tspan><tspan x="1186" dy="19">видны рядом.</tspan></text>
  <rect x="1185" y="620" width="170" height="166" rx="4" fill="#f5edd6"/><text x="1200" y="650" fill="#7a5c1a" font-family="Arial,sans-serif" font-size="12" font-weight="700">АВТОДОБАВЛЕНИЕ</text><text x="1200" y="679" fill="#30352e" font-family="Arial,sans-serif" font-size="12"><tspan x="1200">Только базовый</tspan><tspan x="1200" dy="18">продукт при отметке</tspan><tspan x="1200" dy="18">«Закончилось».</tspan></text>
  <text x="76" y="882" fill="#66675d" font-family="Arial,sans-serif" font-size="13">Статус передан не только цветом: всегда есть короткая подпись и тетрадный маркер.</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#4f6848" stroke-width="1.5"/></marker></defs>
</svg>
