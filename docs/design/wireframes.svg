  <g transform="translate(20 52)" font-family="Arial,sans-serif"><use href="#phone"/><text x="20" y="82" font-size="18" font-weight="700" fill="#333">Дома</text><text x="20" y="105" font-size="11" fill="#666">Продукты по разделам</text><rect x="194" y="67" width="90" height="28" rx="4" fill="#ddd" stroke="#777"/><text x="211" y="85" font-size="11" fill="#333">+ Добавить</text><rect x="16" y="120" width="268" height="230" fill="#f5f5f5" stroke="#888"/><text x="28" y="143" font-size="13" font-weight="700" fill="#333">Холодильник⌄</text><g transform="translate(0 153)"><use href="#row"/><use href="#row" y="54"/><use href="#row" y="108"/></g><rect x="16" y="365" width="268" height="142" fill="#f5f5f5" stroke="#888"/><text x="28" y="388" font-size="13" font-weight="700" fill="#333">Шкаф⌄</text><g transform="translate(0 398)"><use href="#row"/><use href="#row" y="54"/></g><text x="20" y="580" font-size="11" fill="#555">Статус базового продукта</text><text x="20" y="596" font-size="11" fill="#555">переключает наличие</text><text x="0" y="692" font-size="14" font-weight="700" fill="#333">01 · Дом</text></g>
